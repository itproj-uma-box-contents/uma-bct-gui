[project]
name = "uma-bct-gui"
version = "0.1.0"
description = "GUI for manually verifying VLM-transcribed UMA box catalogue outputs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet>=1.0.1",
]

[project.scripts]
uma-bct-gui = "uma_bct_gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uma_bct_gui"]
