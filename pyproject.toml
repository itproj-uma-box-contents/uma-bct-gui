[project]
name = "uma-bct-gui"
version = "0.1.0"
description = "GUI for manually verifying VLM-transcribed UMA box catalogue outputs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet[desktop]>=1.0.1",
    "openpyxl>=3.1",
]

[project.scripts]
uma-bct-gui = "main:main"

[project.optional-dependencies]
# Keep the original launch command working; Excel support is now included.
excel = [
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
